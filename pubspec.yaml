name: Amplify
description: Amplify — a personalized music player using YouTube as the audio source.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.6

  # Audio playback
  just_audio: ^0.9.41
  just_audio_background: ^0.0.1-beta.13
  audio_service: ^0.18.15

  # State management
  provider: ^6.1.2

  # Images
  cached_network_image: ^3.3.1

  # Utilities
  equatable: ^2.0.5
  uuid: ^4.4.0
  path_provider: ^2.1.2

  # Backend integration
  http: ^1.2.2
  flutter_secure_storage: ^9.2.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  flutter_launcher_icons: ^0.14.1

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/icon/

# Generates native app icons (Android + iOS) from a single source image.
# Run: flutter pub run flutter_launcher_icons
flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/icon/app_icon.png"
  min_sdk_android: 21
  remove_alpha_ios: true